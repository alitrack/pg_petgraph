name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_BUILD_JOBS: 1

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pgrx
        run: cargo pgrx --version 2>/dev/null || cargo install cargo-pgrx --locked

      - name: Build PG16
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-server-dev-16
          cargo pgrx init --pg16 /usr/lib/postgresql/16/bin/pg_config
          cargo build --release --no-default-features --features pg16
          mkdir -p artifacts
          cp target/release/libpg_petgraph.so artifacts/pg_petgraph-pg16-v${{ steps.version.outputs.version }}-linux-x86_64.so
          # Clean build artifacts to save space
          cargo clean
          rm -rf ~/.pgrx

      - name: Build PG17
        run: |
          sudo apt-get install -y postgresql-17 postgresql-server-dev-17
          cargo pgrx init --pg17 /usr/lib/postgresql/17/bin/pg_config
          cargo build --release --no-default-features --features pg17
          cp target/release/libpg_petgraph.so artifacts/pg_petgraph-pg17-v${{ steps.version.outputs.version }}-linux-x86_64.so

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
