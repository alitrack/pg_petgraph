name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_BUILD_JOBS: 1

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pgrx
        run: cargo install cargo-pgrx --version 0.13.1 --locked --force

      - name: Install PG16 dev headers
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-server-dev-16 postgresql-17 postgresql-server-dev-17

      - name: Package PG16
        run: |
          cargo pgrx init --pg16 /usr/lib/postgresql/16/bin/pg_config
          cargo pgrx package --pg-config /usr/lib/postgresql/16/bin/pg_config --no-default-features --features pg16
          mv target/release/pg_petgraph-pg16 pg_petgraph-pg16
          tar czf artifacts/pg_petgraph-pg16-v${{ steps.version.outputs.version }}-linux-x86_64.tar.gz pg_petgraph-pg16/
          rm -rf ~/.pgrx && cargo clean

      - name: Package PG17
        run: |
          cargo pgrx init --pg17 /usr/lib/postgresql/17/bin/pg_config
          cargo pgrx package --pg-config /usr/lib/postgresql/17/bin/pg_config --no-default-features --features pg17
          mv target/release/pg_petgraph-pg17 pg_petgraph-pg17
          tar czf artifacts/pg_petgraph-pg17-v${{ steps.version.outputs.version }}-linux-x86_64.tar.gz pg_petgraph-pg17/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
