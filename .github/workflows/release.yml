name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_BUILD_JOBS: 1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg: [16, 17]
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install PostgreSQL
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: release-cache-${{ matrix.pg }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/**/*.rs') }}
          restore-keys: |
            release-cache-${{ matrix.pg }}-

      - name: Install pgrx
        run: cargo install cargo-pgrx --locked

      - name: Init pgrx
        run: cargo pgrx init --pg${{ matrix.pg }} /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      - name: Build release
        run: cargo build --release --no-default-features --features pg${{ matrix.pg }}

      - name: Rename artifact
        run: |
          mkdir -p artifacts
          cp target/release/libpg_petgraph.so \
             artifacts/pg_petgraph-pg${{ matrix.pg }}-v${{ steps.version.outputs.version }}-linux-x86_64.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg_petgraph-pg${{ matrix.pg }}
          path: artifacts/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pg_petgraph-pg*
          path: artifacts/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
