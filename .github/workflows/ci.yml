name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_BUILD_JOBS: 1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg: [16, 17]
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-cache-${{ matrix.pg }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/**/*.rs') }}
          restore-keys: |
            rust-cache-${{ matrix.pg }}-

      - name: Install pgrx
        run: cargo install cargo-pgrx --version 0.13.1 --locked --force

      - name: Init pgrx
        run: cargo pgrx init --pg${{ matrix.pg }} /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      - name: Build
        run: cargo build --profile ci --no-default-features --features pg${{ matrix.pg }}

      - name: Test
        run: cargo pgrx test pg${{ matrix.pg }} --no-default-features --features pg${{ matrix.pg }}
