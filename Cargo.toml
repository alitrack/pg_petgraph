[package]
name = "pg_petgraph"
version = "0.1.0"
edition = "2021"
description = "PostgreSQL graph algorithm extension — 10 graph algorithms (PageRank, betweenness, closeness, eigenvector, SCC, connected components, Dijkstra, topological sort, cycle detection, Louvain) as plain SQL functions"
license = "MIT"
repository = "https://github.com/alitrack/pg_petgraph"

[lib]
# pgrx 0.19 no longer needs an `rlib` crate type or a separate `pgrx_embed` bin —
# `.cargo/config.toml`-free embedding is done by cargo-pgrx itself, and the
# `pgrx::pgrx_embed!()` macro was removed from the crate.
crate-type = ["cdylib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg_test = []

[dependencies]
pgrx = "=0.19.2"
petgraph = "0.7"

[dev-dependencies]
pgrx-tests = "=0.19.2"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 4
opt-level = 2
